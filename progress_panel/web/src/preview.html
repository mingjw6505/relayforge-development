<div id="relayforge-progress-preview">
  <style>
    {{STYLE}}
    #relayforge-progress-preview .rf-preview-controls {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;color:light-dark(#626262,#b4b4b4);font:12px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #relayforge-progress-preview .rf-preview-controls label {display:flex;align-items:center;gap:8px}
    #relayforge-progress-preview .rf-preview-controls select {font:inherit;min-height:32px;border:1px solid light-dark(#dedede,#414141);border-radius:7px;background:light-dark(#f5f5f5,#2c2c2c);color:light-dark(#202020,#f2f2f2);padding:5px 26px 5px 9px;max-width:100%}
    #relayforge-progress-preview .rf-preview-stage {padding:22px 0;display:flex;justify-content:center}
    #relayforge-progress-preview .rf-preview-stage > .rf-progress {width:100%;max-width:640px}
    @media(pointer:coarse){#relayforge-progress-preview .rf-preview-controls select{min-height:44px}}
  </style>
  <div class="rf-preview-controls"><span>模拟预览 · 示例数据</span><label>展示状态<select id="rf-preview-scenario" aria-label="展示状态"></select></label></div>
  <div class="rf-preview-stage viz-dotted-background"><div class="rf-progress" id="rf-preview-card" aria-label="进度卡片模拟预览">{{CARD}}</div></div>
  <script>{{SCRIPT}}</script>
</div>
